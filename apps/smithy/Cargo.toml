[package]
name = "smithy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Smithy - a native Rust IDE with a local-first coding agent"

[[bin]]
name = "smithy"
path = "src/main.rs"

[dependencies]
smithy-editor.workspace = true
smithy-agent.workspace = true
smithy-tools.workspace = true
smithy-project.workspace = true
sysinfo.workspace = true
smithy-voice.workspace = true
floem.workspace = true
tokio.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
async-trait.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSArray",
    "NSEnumerator",
    "NSGeometry",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSApplication",
    "NSResponder",
    "NSScreen",
    "NSWindow",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
