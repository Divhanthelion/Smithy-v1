# Build, lint and test on every push and pull request.
#
# **macOS, not Linux.** `smithy-voice` depends on `candle-core` with the
# `accelerate` feature — Apple's framework — so the workspace does not build on
# a Linux runner at all. This is not a runner preference that can be flipped to
# save minutes; it is the only platform the tree compiles on today. macOS
# runners are free for public repositories.
#
# **No `cargo fmt` gate, deliberately.** The tree is not rustfmt-clean and is
# not meant to be: doc comments are hand-wrapped throughout and `cargo fmt
# --all` produces a ~127-file diff that fights formatting done on purpose.
# Adding a fmt job here would either be permanently red or force that diff.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build · clippy · test
    runs-on: macos-latest
    # The full workspace includes candle and eleven tree-sitter grammars; a cold
    # build is not fast. Generous, but still a ceiling rather than a hang.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # `rust-version = "1.91"` in the workspace comes from floem's pinned
      # revision, so stable is the floor as well as the target. No toolchain
      # file exists; if one is ever added, drop the explicit toolchain here.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Keyed on Cargo.lock: floem is a git dependency and the lock is the only
      # thing that pins its revision, so a lock change must miss the cache.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The README states "0 warnings, and it stays 0". This step is what makes
      # that a fact rather than an aspiration, so it is a hard gate.
      #
      # It is one warning away from green: `longitude_from_timezone` in
      # `smithy-editor/src/localtime.rs` is unused. Note *why* before deciding —
      # it is not an unfinished feature, it is a road already taken and
      # abandoned. `celestial::todays_sun` documents that deriving longitude
      # from the timezone meridian made the frame sun and the backdrop sky
      # disagree by over an hour, and it was replaced by computing both at
      # `DEFAULT_LOCATION`. So the function lost its argument and should
      # probably be deleted, not allowed and not rewired.
      #
      # The real gap it points at is separate: `DEFAULT_LOCATION` is San
      # Francisco "until a setting exists for it", and that setting still does
      # not exist. Until one of those lands, this job is red on purpose.
      - name: Build (warnings are errors)
        run: cargo build --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings

      # 947 tests, about ten seconds. Everything that touches the network, a
      # keychain or a display is already behind a scripted provider or a
      # tempdir, so nothing here needs a secret or a window server.
      - name: Test
        run: cargo test --workspace

      # Reporting, not gating — for now.
      #
      # `--all-targets` reaches tests and examples that the build step does not
      # lint, and there are currently ten findings there: four
      # `field_reassign_with_default`, two `too_many_arguments`, and one each of
      # `single_match`, `print_literal`, `if_same_then_else`,
      # `cloned_ref_to_slice_refs`. None is a bug; all are small.
      #
      # This is a ratchet, and it is meant to be flipped. Once those ten are
      # cleared, delete `continue-on-error` and add `-D warnings` here too. A
      # lint job that is allowed to fail forever is a lint job nobody reads.
      - name: Clippy
        run: cargo clippy --workspace --all-targets
        continue-on-error: true
