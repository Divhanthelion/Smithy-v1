[package]
name = "smithy-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Smithy agent loop: append-only history, resource budgets, and provider-agnostic tool calling"

[dependencies]
smithy-tools.workspace = true
smithy-project.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
futures-util.workspace = true
thiserror.workspace = true
keyring.workspace = true
# Session replay must be tied to the exact credential and tool-schema bytes
# without ever storing either. SHA-256 gives a stable one-way identity; a
# hand-rolled hash would be collision-prone precisely where a false match would
# replay one account's conversation into another.
sha2 = "0.11.0"
# Saves compare and rename under a store-wide OS lock. A process-local mutex
# cannot stop two open Smithy windows from both accepting the same predecessor;
# fs2 supplies the platform file-locking semantics without hand-written flock.
fs2 = "0.4.3"

[dev-dependencies]
tempfile.workspace = true
# Paused time makes deadline races exact. Sleeping in cancellation tests made
# a loaded machine indistinguishable from a broken absolute-deadline contract.
tokio = { workspace = true, features = ["test-util"] }
# A dev-dependency on ourselves, with `testing` on. This is how `tests/` gets at
# `provider::test_support` without making the feature a default: `cargo test`
# enables no non-default features on its own, and the alternative — shipping the
# scripted provider in release builds — is the thing the gate exists to prevent.
smithy-agent = { path = ".", features = ["testing"] }


[[example]]
name = "smoke"
path = "examples/smoke.rs"

[features]
# Exposes `provider::test_support` — the scripted provider and its helpers — so
# integration tests in `tests/` can drive the loop without an endpoint. Not a
# default: a release build must not be able to construct a fake provider.
testing = []
