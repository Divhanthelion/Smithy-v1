[package]
name = "smithy-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Editor engine for Smithy - text buffers, syntax highlighting, terminal, LSP, and UI components"

[lib]
name = "smithy_editor"
path = "src/lib.rs"

[dependencies]
# Already in the tree transitively. Used only by `localtime`, for `localtime_r`
# — the platform's own timezone database, rather than a second copy of it.
libc = "0.2"
smithy-fisherman = { workspace = true }
smithy-sky = { workspace = true }
smithy-voice = { workspace = true }
ropey.workspace = true
lapce-xi-rope.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-go.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-json.workspace = true
tree-sitter-html.workspace = true
tree-sitter-css.workspace = true
streaming-iterator.workspace = true
tokio.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
reqwest.workspace = true
floem.workspace = true
rfd.workspace = true
portable-pty.workspace = true
vte.workspace = true
dirs.workspace = true
lsp-types.workspace = true
async-lsp.workspace = true
crossbeam-channel.workspace = true
which.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
ignore.workspace = true
async-trait.workspace = true
regex.workspace = true
futures-util.workspace = true
similar.workspace = true
percent-encoding.workspace = true

